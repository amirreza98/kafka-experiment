services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  producer:
    build: ./xnicedemo
    container_name: producer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:19092
    restart: on-failure
    develop:
      watch:
        - action: sync+restart
          path: ./xnicedemo
          target: /app

  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      - kafka
    ports:
      - "4001:4001"
    environment:
      KAFKA_BROKER: kafka:19092
      WS_PORT: 4001
    restart: on-failure
    develop:
      watch:
        - action: sync+restart
          path: ./consumer
          target: /app

  frontend-client:
    build: ./frontend/client
    container_name: frontend-client
    depends_on:
      - consumer
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync+restart
          path: ./frontend/client
          target: /app
